```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shubham Yadav | My Project</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #312e81, transparent 40%),
                radial-gradient(circle at bottom right, #581c87, transparent 40%),
                #050816;

            color: white;

        }


        .box {

            width: 90%;
            max-width: 700px;

            text-align: center;

            padding: 60px 40px;

            border-radius: 25px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(15px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.5);

        }


        .small {

            color: #a78bfa;

            font-size: 13px;

            letter-spacing: 3px;

            font-weight: bold;

            margin-bottom: 20px;

        }


        h1 {

            font-size: 55px;

            margin-bottom: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a78bfa,
                    #60a5fa
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }


        p {

            color: #a5afc0;

            font-size: 17px;

            line-height: 1.8;

            margin-bottom: 30px;

        }


        .line {

            width: 70px;

            height: 3px;

            margin: 0 auto 30px;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #6366f1,
                    #a855f7
                );

        }


        .button {

            display: inline-flex;

            align-items: center;

            gap: 12px;

            padding: 17px 32px;

            color: white;

            text-decoration: none;

            font-weight: bold;

            font-size: 16px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #9333ea
                );

            box-shadow:
                0 15px 35px
                rgba(99,102,241,0.35);

            transition: 0.3s;

        }


        .button:hover {

            transform:
                translateY(-6px)
                scale(1.03);

            box-shadow:
                0 20px 50px
                rgba(139,92,246,0.5);

        }


        .arrow {

            font-size: 20px;

            transition: 0.3s;

        }


        .button:hover .arrow {

            transform: translateX(7px);

        }


        .footer {

            margin-top: 35px;

            color: #596477;

            font-size: 12px;

        }


        @media(max-width:600px) {

            .box {
                padding: 45px 25px;
            }

            h1 {
                font-size: 40px;
            }

            p {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <div class="box">

        <div class="small">
            WELCOME TO MY PROJECT
        </div>


        <h1>
            Shubham Yadav
        </h1>


        <div class="line"></div>


        <p>

            Explore my portfolio, projects,
            technical skills and journey as a
            developer.

        </p>


        <!--

            SAME folder as this file.
        -->

        <a
            href="project1.html"
            class="button"
        >

            Explore My Portfolio

            <span class="arrow">
                →
            </span>

        </a>


        <div class="footer">

            Built with HTML & CSS · © 2026 Shubham Yadav

        </div>

    </div>


</body>

</html>
